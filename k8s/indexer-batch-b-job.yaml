# Part A Batch B (and E3 data drift): copies Batch B into /corpus/batch_b on the PVC (if not
# already there) and ingests it TOGETHER with the existing corpus, so unchanged documents embed 0
# chunks and the recency check sees that doc07 (2027) supersedes academic-rules-2026.md.
#   kubectl apply -f k8s/indexer-batch-b-job.yaml && kubectl logs -f job/indexer-batch-b -n rahbar
# For the demo's unseen documents: copy them into /corpus/batch_b with the toolbox pod
# (k8s/toolbox-pod.yaml) and re-run this Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer-batch-b
  namespace: rahbar
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/part-of: rahbar-ragops
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indexer   # NetworkPolicy: only this label may write to Chroma
        app.kubernetes.io/part-of: rahbar-ragops
    spec:
      restartPolicy: OnFailure
      serviceAccountName: rahbar-indexer
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        # The PVC hides /corpus in the image, so seed it once from /seed (data lake on the PVC, F1).
        - name: seed-corpus
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /corpus && if [ ! -f /corpus/.seeded ]; then cp -n /seed/corpus/* /corpus/ && touch /corpus/.seeded && echo seeded corpus; else echo corpus already seeded; fi; mkdir -p /corpus/batch_b && cp -n /seed/batch_b/*.md /corpus/batch_b/ && echo copied Batch B; mkdir -p /data/results /data/traces"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: corpus-volume
              mountPath: /corpus
            - name: data
              mountPath: /data
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "pipeline.run"]
          args: ["--corpus-dir", "/corpus", "--batch-b"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: rahbar-config
          env: []
          # Measured with `kubectl top pod` during a full run (copy the numbers into the report, F5).
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: corpus-volume
              mountPath: /corpus
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: corpus-volume
          persistentVolumeClaim:
            claimName: corpus-pvc
        - name: data
          persistentVolumeClaim:
            claimName: eval-results-pvc
        - name: tmp
          emptyDir: {}
