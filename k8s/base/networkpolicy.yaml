# Deny by default, then allow only the paths the architecture needs (A2 4.7).
# Pods are selected by app.kubernetes.io/name, except the two API Deployments (live and
# candidate), which share the label rahbar/role: api-server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: rahbar
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: rahbar
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ui: serves static files on 8080 (to the ingress controller and kubelet probes) and calls
# nothing itself (the browser calls /api through the Ingress), so it has no egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ui
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# api (live and candidate): from the ingress controller, the ui, the eval Job and
# `kubectl port-forward` (which arrives from the node); out to chroma, redis and the LLM.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      rahbar/role: api-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ui
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: eval-job
        - ipBlock:
            cidr: 0.0.0.0/0   # node-originated traffic: kubelet probes and port-forward
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chroma
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # Ollama on the laptop (host.minikube.internal) or a hosted provider
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 11434
        - protocol: TCP
          port: 443
---
# chroma: read by the APIs, written by the indexer Jobs only. Nothing else, ui included.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-chroma
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chroma
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              rahbar/role: api-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: indexer
      ports:
        - protocol: TCP
          port: 8000
---
# redis: the APIs use the cache; the indexer Job only connects to expire it after a re-index
# (A2 3.3 "invalidate on re-index").
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              rahbar/role: api-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: indexer
      ports:
        - protocol: TCP
          port: 6379
---
# indexer Job / CronJob / candidate and Batch-B indexer Jobs (all labelled indexer)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-indexer
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: indexer
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chroma
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 11434
---
# eval Job: calls the live or candidate API, and Ollama directly for the module-level
# embedding test and the faithfulness judge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-eval
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: eval-job
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              rahbar/role: api-server
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 11434
