# Part C1 / F3: builds the CANDIDATE collection (chunk size 250/40 instead of 400/50) in its own
# collection "rahbar-candidate", from the same verified corpus. Only an indexer Job writes Chroma.
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer-candidate
  namespace: rahbar
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/part-of: rahbar-ragops
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indexer   # NetworkPolicy: only this label may write to Chroma
        app.kubernetes.io/part-of: rahbar-ragops
    spec:
      restartPolicy: OnFailure
      serviceAccountName: rahbar-indexer
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        # The PVC hides /corpus in the image, so seed it once from /seed (data lake on the PVC, F1).
        - name: seed-corpus
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /corpus && if [ ! -f /corpus/.seeded ]; then cp -n /seed/corpus/* /corpus/ && touch /corpus/.seeded && echo seeded corpus; else echo corpus already seeded; fi; mkdir -p /data/results /data/traces"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: corpus-volume
              mountPath: /corpus
            - name: data
              mountPath: /data
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "pipeline.run"]
          args: ["--corpus-dir", "/corpus"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            - name: CHROMA_COLLECTION
              value: "rahbar-candidate"
            # C1 change under test: smaller chunks with less overlap (baseline 400 / 50)
            - name: CHUNK_SIZE
              value: "250"
            - name: CHUNK_OVERLAP
              value: "40"
          # Measured with `kubectl top pod` during a full run (copy the numbers into the report, F5).
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: corpus-volume
              mountPath: /corpus
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: corpus-volume
          persistentVolumeClaim:
            claimName: corpus-pvc
        - name: data
          persistentVolumeClaim:
            claimName: eval-results-pvc
        - name: tmp
          emptyDir: {}
