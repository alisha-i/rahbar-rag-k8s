name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Verify Pre-deployment Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt -r indexer/requirements.txt pytest pytest-cov Pillow

      - name: Run test suite
        run: |
          PYTHONPATH=api python -m pytest api/tests
          PYTHONPATH=indexer python -m pytest indexer/tests

  publish:
    name: Build & Publish Release Images
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:latest

      - name: Build and push Indexer image
        uses: docker/build-push-action@v5
        with:
          context: ./indexer
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:latest

      - name: Build and push UI image
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:latest

  deploy:
    name: Deploy to Production Cluster
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply production manifests
        run: |
          kubectl apply -k k8s/overlays/prod/

      - name: Wait for API rollout status
        run: |
          kubectl rollout status deployment/api -n rahbar --timeout=180s

      - name: Wait for UI rollout status
        run: |
          kubectl rollout status deployment/ui -n rahbar --timeout=120s
