name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  test:
    name: Verify Pre-deployment Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r indexer/requirements.txt pytest pytest-cov Pillow

      - name: Run test suite with coverage gate
        run: |
          PYTHONPATH=api python -m pytest api/tests --cov=app --cov-fail-under=60
          PYTHONPATH=indexer python -m pytest indexer/tests

  build-push:
    name: Build & Push Images
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ env.DH_USER }}/rahbar-api:${{ github.sha }}

      - name: Build and push Indexer image
        uses: docker/build-push-action@v5
        with:
          context: ./indexer
          push: true
          tags: ${{ env.DH_USER }}/rahbar-indexer:${{ github.sha }}

      - name: Build and push UI image
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          push: true
          tags: ${{ env.DH_USER }}/rahbar-ui:${{ github.sha }}

  deploy:
    name: Deploy to Ephemeral Cluster & Verify Rollout
    needs: [build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create kind ephemeral cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind-rahbar-cd

      - name: Set up Kustomize
        run: |
          if ! command -v kustomize &> /dev/null; then
            curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
            sudo mv kustomize /usr/local/bin/
          fi

      - name: Pin prod overlay to this commit SHA
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image \
            rahbar-api=${DH_USER}/rahbar-api:${{ github.sha }} \
            rahbar-indexer=${DH_USER}/rahbar-indexer:${{ github.sha }} \
            rahbar-ui=${DH_USER}/rahbar-ui:${{ github.sha }}

      - name: Apply production manifests
        run: |
          kubectl apply -k k8s/overlays/prod/

      - name: Index fixture corpus, then wait for rollout
        run: |
          kubectl create job --from=cronjob/reindex cd-index-${{ github.run_id }} -n rahbar
          kubectl wait --for=condition=complete job/cd-index-${{ github.run_id }} -n rahbar --timeout=300s
          kubectl rollout status deployment/api -n rahbar --timeout=180s
          kubectl rollout status deployment/ui -n rahbar --timeout=120s

      - name: Smoke test API readiness
        run: |
          kubectl port-forward svc/api 8000:8000 -n rahbar &
          sleep 5
          curl -fsS http://127.0.0.1:8000/readyz
