name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linter
        run: pip install ruff

      - name: Run Python linter
        run: ruff check --config ruff.toml .

  unit-tests:
    name: Unit & Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r indexer/requirements.txt pytest pytest-cov Pillow

      - name: Run test suite with coverage gate
        run: |
          PYTHONPATH=api python -m pytest api/tests --cov=app --cov-fail-under=60
          PYTHONPATH=indexer python -m pytest indexer/tests

  manifest-validation:
    name: Kubeconform Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubeconform
        run: |
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests with kubeconform
        run: |
          set -o pipefail
          validate() {
            for i in 1 2 3; do
              if "$@"; then return 0; fi
              echo "kubeconform attempt $i failed, retrying..."; sleep 5
            done
            return 1
          }
          validate bash -c 'kubectl kustomize k8s/overlays/prod/ | kubeconform -strict -summary -ignore-missing-schemas -'
          validate bash -c 'kubectl kustomize k8s/overlays/dev/ | kubeconform -strict -summary -ignore-missing-schemas -'

  build-and-scan:
    name: Docker Build & Vulnerability Scan
    needs: [lint, unit-tests, manifest-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local container images
        run: |
          docker build -t rahbar-api:${{ github.sha }} ./api
          docker build -t rahbar-indexer:${{ github.sha }} ./indexer
          docker build -t rahbar-ui:${{ github.sha }} ./ui

      - name: Trivy vulnerability scan
        run: |
          for img in rahbar-api rahbar-indexer rahbar-ui; do
            echo "=== scanning $img ==="
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/" \
              aquasec/trivy:0.58.1 image \
              --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 0 \
              "$img:${{ github.sha }}"
          done

  e2e-eval:
    name: Ephemeral Kind Cluster & Golden Evaluation Gate
    needs: [build-and-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create kind ephemeral cluster
        uses: helm/kind-action@v1.12.0
        with:
          version: v0.27.0
          node_image: kindest/node:v1.32.2
          cluster_name: kind-rahbar
          wait: 180s

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install eval dependencies
        run: |
          pip install httpx pyyaml pytest

      - name: Build local container images
        run: |
          docker build -t rahbar-api:dev -t rahbar-api:${{ github.sha }} ./api
          docker build -t rahbar-indexer:dev -t rahbar-indexer:${{ github.sha }} ./indexer
          docker build -t rahbar-ui:dev -t rahbar-ui:${{ github.sha }} ./ui
          kind load docker-image rahbar-api:dev --name kind-rahbar
          kind load docker-image rahbar-indexer:dev --name kind-rahbar
          kind load docker-image rahbar-ui:dev --name kind-rahbar

      - name: Deploy Kubernetes resources
        run: |
          kubectl apply -k k8s/overlays/dev/

      - name: Wait for Chroma and Redis
        run: |
          kubectl rollout status statefulset/chroma -n rahbar --timeout=180s
          kubectl rollout status deployment/redis -n rahbar --timeout=120s

      - name: Run indexer Job on fixture corpus
        run: |
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=300s \
            || (kubectl describe job/indexer -n rahbar; kubectl logs job/indexer -n rahbar --tail=80; exit 1)

      - name: Wait for API rollout status
        run: |
          kubectl rollout status deployment/api -n rahbar --timeout=120s

      - name: Port forward API service
        run: |
          kubectl port-forward svc/api 8000:8000 -n rahbar &
          sleep 5

      - name: Run evaluation runner regression gate
        run: |
          python eval/run_eval.py --api http://127.0.0.1:8000 --golden eval/fixtures/golden.fixture.yaml --baseline eval/baseline.json
